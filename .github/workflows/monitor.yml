name: 24hr River Level Monitor

on:
  schedule:
    # 改為每 10 分鐘執行一次 (大幅提高 GitHub 排程配給的準點率)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授予寫入與 Push 權限

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: 執行水位監控腳本
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WEBAPP_URL: ${{ secrets.GOOGLE_WEBAPP_URL }}
        run: python monitor.py

      - name: 更新警報快取記錄 (Push alert_cache.json)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f alert_cache.json ]; then
            git add alert_cache.json
            # [skip ci] 可防止 push 後再次誤觸發工作流程
            git diff-index --quiet HEAD || git commit -m "chore: update alert cache [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
